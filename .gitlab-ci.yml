# CI on every push: validate registry, test + build matrix, SAST.
stages:
  - validate
  - test
  - build
  - sast

variables:
  GO_VERSION: '1.25'
  PYTHON_VERSION: '3.11'

# Validate registry
validate:
  stage: validate
  image: python:${PYTHON_VERSION}
  script:
    - pip install -r requirements.txt
    - python scripts/build_catalog.py --validate

# Test matrix: Go 1.25 on Linux, macOS, Windows
test:linux:
  stage: test
  image: golang:${GO_VERSION}
  needs:
    - validate
  script:
    - go test -v ./...

test:macos:
  stage: test
  tags:
    - macos
  needs:
    - validate
  script:
    - go test -v ./...

test:windows:
  stage: test
  tags:
    - windows
  needs:
    - validate
  script:
    - go test -v ./...

# Build matrix: Linux, macOS, Windows binaries
build:linux:
  stage: build
  image: golang:${GO_VERSION}
  needs:
    - test:linux
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - go build -o tanuki-linux-amd64 ./cmd/tanuki
  artifacts:
    paths:
      - tanuki-linux-amd64
    expire_in: 30 days

build:macos:
  stage: build
  tags:
    - macos
  needs:
    - test:macos
  variables:
    GOOS: darwin
    GOARCH: amd64
  script:
    - go build -o tanuki-darwin-amd64 ./cmd/tanuki
  artifacts:
    paths:
      - tanuki-darwin-amd64
    expire_in: 30 days

build:windows:
  stage: build
  tags:
    - windows
  needs:
    - test:windows
  variables:
    GOOS: windows
    GOARCH: amd64
  script:
    - go build -o tanuki-windows-amd64.exe ./cmd/tanuki
  artifacts:
    paths:
      - tanuki-windows-amd64.exe
    expire_in: 30 days

# SAST: CodeQL analysis
sast:
  stage: sast
  image: golang:${GO_VERSION}
  script:
    - go clean -cache
    - go build -a ./...
  allow_failure: true
